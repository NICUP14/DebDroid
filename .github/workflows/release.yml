name: Release

# Publishes the release assets a user actually installs: the flashable module
# and the prebuilt debian image, each with its checksum.
#
# Publishing the image here rather than only carrying it in git is what lets a
# device fetch it on demand, so the repository download stops being hundreds of
# megabytes for people who only want the scripts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # NOTE: The branch check below asks whether a commit is reachable from
          #       main, which the default shallow clone cannot answer.
          fetch-depth: 0

      # Work happens on a testing branch, so a tag pushed from there must not
      # publish. Tagging is deliberate; tagging the wrong branch is an easy
      # mistake, and a published release is hard to take back.
      - name: The tagged commit must be on main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # NOTE: Resolved from the tag rather than from GITHUB_SHA, which on a
          #       manual run is the dispatched branch's tip, not the tag.
          if ! commit=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
              echo "::error::No such tag: \"$TAG\"."
              exit 1
          fi

          # NOTE: fetch-depth 0 should already have main, but asking for it by
          #       refspec costs nothing and removes the dependency on exactly
          #       which refs the checkout action chose to fetch.
          git fetch --no-tags --quiet origin \
              '+refs/heads/main:refs/remotes/origin/main' || true

          if ! git rev-parse -q --verify refs/remotes/origin/main > /dev/null; then
              echo "::error::Could not resolve origin/main to check the branch."
              exit 1
          fi

          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
              echo "::error::Tag \"$TAG\" ($commit) is not on main, so it will not be published. Merge it into main and tag again."
              exit 1
          fi

          echo "ok: \"$TAG\" is on main"

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y zip e2fsprogs

      # The app's build is part of "make all"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # Everything that gates a release, before anything is published
      - name: Run the full check suite
        run: make all

      - name: Read the version
        id: version
        run: |
          version=$(sed -n "s/^export DEBDROID_VER='\(.*\)'$/\1/p" debdroid/debdroid_lib.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      # A tag naming one version while the tree says another would publish
      # mislabeled assets, and a published release cannot be corrected once
      # anyone has installed from it
      - name: The tag must match the version in the tree
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag \"$TAG\" does not match DEBDROID_VER \"$VERSION\". Expected \"v$VERSION\"."
              exit 1
          fi

          echo "ok: \"$TAG\" matches the tree"

      # Only the version being released, as the changelog holds every version
      # and publishing the whole history as one release's notes is noise
      - name: Extract the release notes
        run: |
          mkdir -p out
          awk -v v="${{ steps.version.outputs.version }}" '
              $0 == "## " v { found = 1; next }
              found && /^## / { exit }
              found { print }
          ' CHANGELOG.md > out/RELEASE_NOTES.md

          if [ ! -s out/RELEASE_NOTES.md ]; then
              echo "::error::No \"## ${{ steps.version.outputs.version }}\" section in CHANGELOG.md."
              exit 1
          fi

          cat >> out/RELEASE_NOTES.md <<'FOOTER'

          ---

          Verify any asset against `SHA256SUMS` before installing it.
          The full history is in [CHANGELOG.md](CHANGELOG.md).
          FOOTER

          cat out/RELEASE_NOTES.md

      # Two variants: the slim zip downloads the image on first install, the
      # other bundles it for a device with no usable network
      - name: Build the module zips
        run: |
          sh module/build.sh out/DebDroid-module.zip
          sh module/build.sh --with-image out/DebDroid-module-offline.zip

      # The app, published only when it can be signed with the release key
      # NOTE: A key that is lost is an app nobody can update, so where it lives
      #       is the maintainer's decision, not this workflow's. Until the four
      #       secrets exist the release goes out without an apk, and says so,
      #       rather than shipping one signed with a throwaway key that every
      #       later release would then be unable to update.
      - name: Build the signed app
        id: app
        env:
          KEYSTORE_B64: ${{ secrets.DEBDROID_KEYSTORE_B64 }}
          DEBDROID_KEYSTORE_PASSWORD: ${{ secrets.DEBDROID_KEYSTORE_PASSWORD }}
          DEBDROID_KEY_ALIAS: ${{ secrets.DEBDROID_KEY_ALIAS }}
          DEBDROID_KEY_PASSWORD: ${{ secrets.DEBDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
              echo "::warning::No release signing key is configured, so this release has no apk."
              echo "apk=no" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP"/release.jks
          export DEBDROID_KEYSTORE="$RUNNER_TEMP"/release.jks
          (cd app && gradle --console=plain assembleRelease)
          rm -f "$RUNNER_TEMP"/release.jks

          mkdir -p out
          cp app/build/outputs/apk/release/debdroid-app-release.apk out/DebDroid.apk
          echo "apk=yes" >> "$GITHUB_OUTPUT"

      # The image ships as one file rather than the split parts, as a release
      # asset has no size limit worth worrying about
      - name: Assemble the debian image
        run: |
          mkdir -p out
          if [ -f img/debian.img ]; then
              cp img/debian.img out/debian.img
          elif [ -f img/debian.img.part-aa ]; then
              cat img/debian.img.part-* > out/debian.img
          else
              echo "::error::No image found under img/"
              exit 1
          fi

      # An image whose features drifted would not mount on the old kernels this
      # project exists to support, so it is checked before being published
      - name: Verify the image is old-kernel-safe
        run: |
          features=$(dumpe2fs -h out/debian.img 2>/dev/null |
              sed -n 's/^Filesystem features: *//p')
          echo "features: $features"

          case "$features" in
              *has_journal*|*metadata_csum*|*64bit*|*orphan_file*)
                  echo "::error::The image carries features old kernels reject."
                  exit 1
                  ;;
          esac

          if ! dumpe2fs -h out/debian.img 2>/dev/null | grep -q 'ext2\|Filesystem features'; then
              echo "::error::Could not read the image as an ext2 filesystem."
              exit 1
          fi
          echo "ok: the image is old-kernel-safe"

      # An image built with umask 000 once shipped, leaving /usr, /etc and
      # /root writable by everyone and /etc/shadow readable by everyone. It is
      # now built by rootfs/build-image.sh, and this keeps it that way by
      # checking the modes of the paths that matter most.
      - name: Check the image's permissions
        run: |
          problems=0
          for entry in "0755 /usr" "0755 /usr/bin" "0755 /etc" "0700 /root" \
                  "1777 /tmp" "1777 /var/tmp" "0640 /etc/shadow" "4755 /usr/bin/su"; do
              set -- $entry
              mode=$(debugfs -R "stat $2" out/debian.img 2>/dev/null |
                  sed -n 's/.*Mode: *\([0-7]*\).*/\1/p' | head -n 1)
              if [ "$mode" != "$1" ]; then
                  echo "::error::$2 is $mode in the image, expected $1. Rebuild it with rootfs/build-image.sh."
                  problems=$((problems + 1))
              fi
          done
          echo "permission problems in the image: $problems"
          # NOTE: An error, not a warning: the image once shipped with these
          #       writable by everyone, which let any user in debian replace a
          #       program root later ran.
          [ "$problems" -eq 0 ]

      - name: Compress the image
        run: |
          # NOTE: "-n" keeps the source name and mtime out of the header.
          #       Without it gzip embeds the mtime of the file it just
          #       assembled, so republishing the same image produced a
          #       different debian.img.gz every time and the asset could not be
          #       reproduced even though its contents were identical. The
          #       module zips were already reproducible; this makes the image
          #       match.
          gzip -9 -n -c out/debian.img > out/debian.img.gz
          rm out/debian.img
          ls -la out/

      - name: Checksum every asset
        run: |
          cd out
          assets="DebDroid-module.zip DebDroid-module-offline.zip debian.img.gz"
          [ -f DebDroid.apk ] && assets="$assets DebDroid.apk"
          # shellcheck disable=SC2086
          sha256sum $assets > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          assets="out/DebDroid-module.zip out/DebDroid-module-offline.zip out/debian.img.gz out/SHA256SUMS"
          [ -f out/DebDroid.apk ] && assets="$assets out/DebDroid.apk"

          # shellcheck disable=SC2086
          if gh release create "$TAG" \
                  --title "DebDroid $TAG" \
                  --notes-file out/RELEASE_NOTES.md \
                  $assets; then
              exit 0
          fi

          # The release already exists, which happens when a tag is moved onto
          # a fix, so replace the assets and refresh the notes
          # NOTE: The notes are refreshed deliberately. Only "create" sets
          #       them, so re-publishing used to upload corrected assets and
          #       leave the previous notes in place, describing a release that
          #       no longer matched what people were downloading.
          # shellcheck disable=SC2086
          gh release upload "$TAG" --clobber $assets

          gh release edit "$TAG" \
              --title "DebDroid $TAG" \
              --notes-file out/RELEASE_NOTES.md
