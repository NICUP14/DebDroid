name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and dash
        run: sudo apt-get update && sudo apt-get install -y shellcheck dash

      - name: Syntax check
        run: make syntax

      # dash is the closest widely available stand-in for android's sh
      - name: Syntax check with dash
        run: |
          status=0
          for file in install.sh debdroid/*.sh command/*.sh tests/*.sh bin/debinit; do
              dash -n "$file" || { echo "dash rejected $file"; status=1; }
          done
          exit $status

      - name: Shellcheck
        run: make shellcheck

  test:
    name: Host test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the host test suite
        run: make test

  provenance:
    name: Provenance and licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails on a changed checksum, and on any binary nobody wrote down
      - name: Verify the manifest
        run: make provenance

      # A redistributed GPL binary obliges us to ship the license text
      - name: License texts are present
        run: |
          status=0
          for file in licenses/GPL-2.0.txt licenses/Apache-2.0.txt NOTICE THIRD_PARTY.md; do
              if [ ! -s "$file" ]; then
                  echo "::error::Missing or empty: $file"
                  status=1
              fi
          done
          exit $status

      # The repository must not start shipping applications again
      - name: No bundled applications
        run: |
          if find . -name '*.apk' -not -path './.git/*' | grep .; then
              echo "::error::APKs are installed from F-Droid, not committed here."
              exit 1
          fi
          echo "ok: no bundled apks"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Broken links and jargon creeping into the guide tier both erode the
      # three-audience split the documentation is organised around
      - name: Check links and guide vocabulary
        run: make docs

  constraints:
    name: Hard constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android devices support no namespace other than the mount namespace, so
      # a stray --pid or --net flag would break the project on real hardware.
      - name: Only the mount namespace is used
        run: |
          if grep -nE '\b(unshare|nsenter)\b[^|;&]*--(pid|net|uts|ipc|user|cgroup|time|all)\b' \
              install.sh debdroid/*.sh command/*.sh tests/*.sh bin/debinit; then
              echo "::error::Only the mount namespace is supported on android devices."
              exit 1
          fi
          echo "ok: no namespace flag other than --mount"

      # Old phone kernels reject the features a modern mke2fs enables by
      # default, producing an image the device cannot mount at all.
      - name: No unpinned ext4 image creation
        run: |
          if grep -nE 'mke2fs|mkfs\.ext' install.sh debdroid/*.sh command/*.sh tests/*.sh |
                  grep -vE 'mkfs\.ext2' | grep -E 'ext4|-t[[:space:]]+ext'; then
              echo "::error::Image creation must stay ext2, or pin every feature explicitly."
              exit 1
          fi
          echo "ok: no ext4 image creation"

      # DEBDROID_VER is the source of truth; module.prop, TODO.md and the
      # changelog all repeat it, and a stale copy misreports the version
      - name: Version numbers agree
        run: make version

      # A release tag additionally has to match what the tree says
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/^export DEBDROID_VER='\(.*\)'$/\1/p" debdroid/debdroid_env.sh)
          tag=${GITHUB_REF#refs/tags/v}
          if [ "$version" != "$tag" ]; then
              echo "::error::DEBDROID_VER is $version but the tag is v$tag."
              exit 1
          fi
          echo "ok: version $version matches tag v$tag"
